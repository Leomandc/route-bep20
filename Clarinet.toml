[project]
name = "route-bep20"
authors = ["RouteDAO Team"]
description = "A decentralized BEP20 token routing and management system"
telemetry = false
requirements = []
[contracts.bep20-router]
path = "contracts/bep20-router.clar"
depends_on = []

[contracts.token-manager]
path = "contracts/token-manager.clar"
depends_on = []

[contracts.route-vault]
path = "contracts/route-vault.clar"
depends_on = []

[contracts.liquidity-pool]
path = "contracts/liquidity-pool.clar"
depends_on = []

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
